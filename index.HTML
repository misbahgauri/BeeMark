    </div>

    <!-- Floating draw controls, only shown while drawing mode is on -->
    <div id="drawToolbarFloating" class="draw-toolbar-floating hidden">
      <button type="button" class="draw-tool active" data-tool="pen"><i class="fas fa-pen"></i></button>
      <button type="button" class="draw-tool" data-tool="eraser"><i class="fas fa-eraser"></i></button>
      <input type="color" id="penColor" value="#1f282d" />
      <input type="range" id="penSize" min="1" max="20" value="3" />
      <button type="button" id="undoDrawBtn"><i class="fas fa-rotate-left"></i></button>
      <button type="button" id="clearDrawBtn"><i class="fas fa-trash"></i></button>
    </div>

    <div class="note-page-scroll">
      <div class="note-page-body">
        <input type="text" id="noteTitle" class="note-page-title" placeholder="Title" required />

        <div class="page-style-bar">
          <button type="button" class="page-style-btn active" data-style="plain" title="Plain"></button>
          <button type="button" class="page-style-btn" data-style="lined" title="Lined"></button>
          <button type="button" class="page-style-btn" data-style="grid" title="Grid"></button>
          <button type="button" class="page-style-btn" data-style="dot" title="Dot grid"></button>
          <button type="button" class="page-style-btn page-style-icon" data-style="kawaii" title="Kawaii">
            <i class="fas fa-star"></i>
          </button>
          <button type="button" class="page-style-btn page-style-icon" data-style="custom" title="Custom background">
            <i class="fas fa-image"></i>
          </button>

          <span class="page-style-divider"></span>

          <label class="color-swatch-label" title="Line / pattern color">
            <input type="color" id="pageLineColor" value="#c7d2e0" />
          </label>
          <label class="color-swatch-label" title="Page color">
            <input type="color" id="pageBgColor" value="#ffffff" />
          </label>

          <select id="pageBgSizeMode" class="page-bg-size-select" style="display:none;">
            <option value="cover">Fill</option>
            <option value="contain">Fit</option>
            <option value="tile">Tile</option>
          </select>

          <label class="attach-btn page-bg-upload-btn" id="pageBgUploadWrapper" style="display:none;">
            <i class="fas fa-upload"></i> Upload background
            <input type="file" id="pageBgUploadInput" accept="image/*" hidden />
          </label>
        </div>

        <div id="toolbar">
          <select class="ql-header">
            <option value="1">Heading 1</option>
            <option value="2">Heading 2</option>
            <option selected></option>
          </select>
          <select class="ql-font">
            <option value="" selected>Default</option>
            <option value="Montserrat">Montserrat</option>
            <option value="Inter">Inter</option>
            <option value="Poppins">Poppins</option>
            <option value="Nunito">Nunito</option>
            <option value="Quicksand">Quicksand</option>
            <option value="Comic Neue">Comic Neue</option>
            <option value="Caveat">Caveat</option>
            <option value="Pacifico">Pacifico</option>
            <option value="Playfair Display">Playfair Display</option>
            <option value="Lora">Lora</option>
            <option value="Merriweather">Merriweather</option>
            <option value="Roboto Mono">Roboto Mono</option>
          </select>
          <select class="ql-size">
            <option value="10px">10</option>
            <option value="12px">12</option>
            <option value="14px">14</option>
            <option value="16px" selected>16</option>
            <option value="18px">18</option>
            <option value="20px">20</option>
            <option value="24px">24</option>
            <option value="28px">28</option>
            <option value="32px">32</option>
            <option value="40px">40</option>
            <option value="48px">48</option>
          </select>
          <button class="ql-bold"></button>
          <button class="ql-italic"></button>
          <button class="ql-underline"></button>
          <select class="ql-color"></select>
          <select class="ql-background"></select>
          <button class="ql-image"></button>
        </div>

        <!-- Text and stylus ink share this same surface — toggle just decides who catches your touch -->
        <div class="page-canvas-wrapper" id="pageCanvasWrapper">
          <div id="editorContainer" class="note-page-content"></div>
          <canvas id="drawingCanvas"></canvas>
        </div>

        <div class="attachment-section">
          <label class="form-label">Attachments</label>
          <div id="attachmentList" class="attachment-list"></div>
          <label class="attach-btn">
            <i class="fas fa-paperclip"></i> Add file or 3D model
            <input type="file" id="fileInput" multiple hidden />
          </label>
        </div>

        <div class="category-section">
          <label class="form-label">Category</label>
          <div id="categoryChips" class="category-chips"></div>

          <form id="addCategoryForm" class="add-category-form">
            <input type="text" id="newCategoryInput" placeholder="+ Add subject" class="add-category-input" />
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirm Delete Modal -->
  <div id="confirmModal" class="modal-overlay">
    <div class="modal confirmation-modal">
      <div class="modal-body">
        <p class="confirmation-text">Are you sure you want to delete this note?</p>
        <div class="confirmation-buttons">
          <button id="cancelDeleteBtn" class="confirmation-btn cancel-btn">Cancel</button>
          <button id="confirmDeleteBtn" class="confirmation-btn confirm-btn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="script.js"></script>
</body>
</html>
